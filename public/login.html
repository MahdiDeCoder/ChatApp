<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>ChatApp Login</title>
  <link rel="stylesheet" href="http://localhost:3000/style.css" />
</head>
<body>
  <div class="login-container">
    <h2>Welcome to ChatApp!</h2>

      <button type="submit">Login</button>
    </form>
  </div>
</body>
</html>
